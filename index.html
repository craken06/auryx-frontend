<meta name="theme-color" content="#05080f" />

<!-- Tema: se resuelve antes de pintar para evitar el parpadeo claro/oscuro.
     Prioridad: elección guardada > preferencia del sistema > oscuro (marca). -->
<script>
  (function () {
    var theme = null;
    try { theme = localStorage.getItem("auryx-theme"); } catch (e) {}
    if (theme !== "light" && theme !== "dark") {
      theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    }
    document.documentElement.setAttribute("data-theme", theme);
    document.documentElement.classList.add("js");
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", theme === "light" ? "#f3f5f9" : "#05080f");
  })();
</script>
